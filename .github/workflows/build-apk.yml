name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: bun install

      - name: Build Web
        run: bun run build

      - name: Add Capacitor
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Gam3ety com.gam3ety.app --web-dir=dist || true
          npx cap add android || true
          npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gam3ety-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
